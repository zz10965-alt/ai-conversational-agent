  .brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }

  .chip.off { opacity: .55; }
  .chip.off .dot { background: #3a4150; box-shadow: none; }
  .chip.proto { border-color: #4c3d1f; color: var(--warn); font-weight: 600; }
  .chip.proto .dot { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .chip.switch { cursor: pointer; user-select: none; }
  .chip.switch:hover { border-color: var(--accent); }
  .btn {
    font-size: 12px; padding: 5px 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #fff; font-weight: 600; }
  .lang-btn { font-weight: 600; }

/* ================= 2. 双语 UI 文案 ================= */

/* ================= 3. 向量检索（TF-IDF，浏览器内 RAG） ================= */
function tokens(text) {
  const t = text.toLowerCase();
  const words = t.match(/[a-z0-9]+/g) || [];
  const cjk = t.match(/[一-鿿]/g) || [];
  const bigrams = [];
  for (let i = 0; i < cjk.length - 1; i++) bigrams.push(cjk[i] + cjk[i + 1]);
  const wordBigrams = [];
  for (let i = 0; i < words.length - 1; i++) wordBigrams.push(words[i] + '_' + words[i + 1]);
  return words.concat(cjk, bigrams, wordBigrams);
}
function buildIndex(kb) {
  const docs = kb.map(d => ({ title: d.title, content: d.content, full: d.title + '\n' + d.content }));
  const tokDocs = docs.map(d => tokens(d.full));
  const df = {};
  for (const toks of tokDocs) {
    const seen = new Set(toks);
    for (const tk of seen) df[tk] = (df[tk] || 0) + 1;
  }
  const N = docs.length;
  const idf = {};
  for (const tk in df) idf[tk] = Math.log((N + 1) / (df[tk] + 1)) + 1;
  const vecs = tokDocs.map(toks => {
    const tf = {};
    for (const tk of toks) tf[tk] = (tf[tk] || 0) + 1;
    const v = {};
    for (const tk in tf) v[tk] = tf[tk] * idf[tk];
    return v;
  });
  return { docs, vecs, idf };
}
function queryVec(text, idf) {
  const tf = {};
  for (const tk of tokens(text)) tf[tk] = (tf[tk] || 0) + 1;
  const v = {};
  for (const tk in tf) v[tk] = tf[tk] * (idf[tk] || 1);
  return v;
}
function cosineSparse(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (const tk in a) { na += a[tk] * a[tk]; if (b[tk] !== undefined) dot += a[tk] * b[tk]; }
  for (const tk in b) nb += b[tk] * b[tk];
  if (!na || !nb) return 0;
  return dot / (Math.sqrt(na) * Math.sqrt(nb));
}
function search(query, index, topK = 4) {
  const qv = queryVec(query, index.idf);
  return index.docs
    .map((d, i) => ({ title: d.title, content: d.content, score: cosineSparse(qv, index.vecs[i]) }))
    .sort((a, b) => b.score - a.score)
    .slice(0, topK);
}

/* ================= 4. 状态 ================= */
let lang = 'zh';
let webOn = false;
let sessionId = (Math.random().toString(36).slice(2, 14));
const sessions = {};          // sessionId -> [{role, content}]
let indexed = buildIndex(KB_ZH);
let recognition = null;

/* ================= 5. 模拟联网搜索 ================= */
function mockWebSearch(query) {
  return [{
    title: lang === 'zh' ? '（模拟）来自网络的实时搜索结果' : '(Simulated) Live result from the web',
    url: 'example.com/result',
    content: lang === 'zh'
      ? `关于「${query}」，互联网上有大量相关文章与最新资讯。（模拟数据，用于演示联网搜索的交互效果）`
      : `The web has many articles and the latest updates about "${query}". (Simulated data — demonstrates the web search interaction.)`,
    source: 'web', simulated: true, score: 0.6,
  }];
}

/* ================= 6. 回答生成 ================= */
function offlineAnswer(hits) {
  if (!hits.length) return STRINGS[lang].noAnswer;
  return hits.slice(0, 2).map(h => h.content.trim()).join('\n\n');
}
async function callLLM(messages) {
  let cfg = null;
  try { cfg = JSON.parse(localStorage.getItem('llmConfig') || 'null'); } catch (e) {}
  if (!cfg || !cfg.apiKey) return null;
  try {
    const url = (cfg.baseUrl || 'https://api.openai.com/v1').replace(/\/$/, '') + '/chat/completions';
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({ model: cfg.model || 'gpt-4o-mini', messages, temperature: 0.3 }),
    });
    const data = await res.json();
    return data.choices?.[0]?.message?.content || null;
  } catch (e) { return null; }
}
function matchQA(question) {
  const q = question.toLowerCase();
  for (const item of (QA[lang] || QA.zh)) {
    if (item.q.some(kw => q.includes(kw))) return item.a;
  }
  return null;
}
async function generateAnswer(question, history, hits) {
  const context = hits.map(h => `[${h.title}]\n${h.content}`).join('\n\n');
  const sys = lang === 'zh'
    ? '你是知识库问答助手，仅依据参考资料回答，资料没有就如实说明，用中文回答。'
    : 'You are a knowledge-base assistant. Answer only from the provided references; say so if not covered. Reply in English.';
  const real = await callLLM([{ role: 'system', content: sys },
    ...history.slice(-6),
    { role: 'user', content: `参考资料：\n${context}\n\n问题：${question}` }]);
  if (real) return real;
  const preset = matchQA(question);
  if (preset) return preset;
  return offlineAnswer(hits);
}

/* ================= 7. 渲染 ================= */
const $ = id => document.getElementById(id);
function t(key) { return STRINGS[lang][key]; }

function renderEmpty() {
  $('chat').innerHTML = `
    <div class="empty">
      <div class="big">🤖</div>
      <h2>${t('emptyH')}</h2>
      <p>${t('emptyP')}</p>
      <div class="proto-note">${t('protoNote')}</div>
      <div class="feat-title">${t('featTitle')}</div>
      <div class="features">${t('features').map(f => `<span class="f">${f}</span>`).join('')}</div>
      <div class="try-title">${t('tryTitle')}</div>
      <div class="sug">${t('sug').map(s => `<span class="s" onclick="askPreset(this.textContent)">${s}</span>`).join('')}</div>
    </div>`;
}
function askPreset(q) { $('input').value = q; send(); }

function addMsg(role, text, sources) {
  const chat = $('chat');
  const empty = chat.querySelector('.empty');
  if (empty) empty.remove();
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  if (role === 'bot') {
    const head = document.createElement('div');
    head.className = 'role';
    head.innerHTML = `🤖 ${t('assistant')} <span class="speak" title="${t('read')}">🔊</span>`;
    head.querySelector('.speak').onclick = () => speak(text);
    msg.appendChild(head);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.appendChild(bubble);

  if (sources && sources.length) {
    const max = Math.max(...sources.map(s => s.score)) || 1;
    const wrap = document.createElement('div');
    wrap.className = 'sources';
    sources.forEach((s, i) => {
      const chip = document.createElement('span');
      chip.className = 'src' + (s.source === 'web' ? ' web' : '');
      const rel = Math.max(12, Math.round(s.score / max * 100));
      const icon = s.source === 'web' ? '🌐' : '📄';
      const tag = s.source === 'web' ? ` · ${t('webTag')}` : '';
      chip.innerHTML = `${icon} ${s.title}${tag}<span class="bar"><span class="fill" style="width:${rel}%"></span></span>`;
      chip.onclick = () => toggleSrc(wrap, i, s);
      wrap.appendChild(chip);
    });
    msg.appendChild(wrap);
  }
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

function toggleSrc(wrap, idx, s) {
  // 手风琴：先收起同组其他已展开的来源
  wrap.querySelectorAll('.src-body.show').forEach(b => { if (b.dataset.i !== String(idx)) b.classList.remove('show'); });
  let body = wrap.querySelector(`.src-body[data-i="${idx}"]`);
  if (body) { body.classList.toggle('show'); return; }
  body = document.createElement('div');
  body.className = 'src-body show';
  body.dataset.i = idx;
  body.textContent = s.content + (s.simulated ? `\n\n${t('simulated')}` : '');
  wrap.appendChild(body);
}

function showTyping(withSearch) {
  const chat = $('chat');
  const empty = chat.querySelector('.empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing';
  let html = `<div class="role">🤖 ${t('assistant')}</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  if (withSearch) html += `<div class="searching">${t('webSearch')}</div>`;
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() { const el = $('typing'); if (el) el.remove(); }

/* ================= 8. 主流程 ================= */
async function send() {
  const input = $('input');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  addMsg('user', q);
  showTyping(webOn);
  // 模拟联网搜索延迟
  if (webOn) await new Promise(r => setTimeout(r, 700));

  const history = sessions[sessionId] || [];
  const hits = search(q, indexed, 4);
  let sources = hits.map(h => ({ title: h.title, score: h.score, content: h.content, source: 'kb' }));
  if (webOn) sources = sources.concat(mockWebSearch(q));

  const answer = await generateAnswer(q, history, hits);
  hideTyping();
  addMsg('bot', answer, sources);

  sessions[sessionId] = history.concat(
    [{ role: 'user', content: q }, { role: 'assistant', content: answer }]
  );
}

async function newChat() {
  sessions[sessionId] = [];
  sessionId = (Math.random().toString(36).slice(2, 14));
  renderEmpty();
}

/* ================= 9. 语音（Web Speech API） ================= */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text.replace(/[「」【】*#]/g, ''));
  u.lang = lang === 'zh' ? 'zh-CN' : 'en-US';
  u.rate = 1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    addMsg('bot', lang === 'zh' ? '当前浏览器不支持语音输入（建议使用 Chrome）。' : 'Voice input is not supported in this browser (try Chrome).');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!recognition) {
    recognition = new SR();
    recognition.lang = lang === 'zh' ? 'zh-CN' : 'en-US';
    recognition.interimResults = false;
    recognition.onresult = e => {
      const text = e.results[0][0].transcript;
      $('input').value = text;
      send();
    };
    recognition.onend = () => $('mic').classList.remove('rec');
    recognition.onerror = () => $('mic').classList.remove('rec');
  }
  recognition.lang = lang === 'zh' ? 'zh-CN' : 'en-US';
  $('mic').classList.add('rec');
  recognition.start();
}

/* ================= 10. 语言 / 联网开关 / 设置 ================= */
function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  indexed = buildIndex(lang === 'zh' ? KB_ZH : KB_EN);
  $('langBtn').textContent = lang === 'zh' ? 'EN' : '中文';
  applyI18n();
  renderKB();
  renderEmpty();
}
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (k === 'brandSub') el.textContent = t('brandSub');
    else el.textContent = t(k);
  });
  $('input').placeholder = t('inputPh');
}
function renderKB() {
  const kb = lang === 'zh' ? KB_ZH : KB_EN;
  $('kbList').innerHTML = kb.map(d =>
    `<div class="kb-item"><div class="t">📄 ${d.title}</div><div class="m">${t('indexed')}</div></div>`
  ).join('');
  $('sideFoot').innerHTML = t('foot')(kb);
}
function toggleWeb() {
  webOn = !webOn;
  const chip = $('chipWeb');
  chip.classList.toggle('off', !webOn);
}
function hasLLM() { try { return !!(JSON.parse(localStorage.getItem('llmConfig') || 'null')?.apiKey); } catch (e) { return false; } }
function openSettings() {
  $('modalBg').classList.add('show');
  try {
    const c = JSON.parse(localStorage.getItem('llmConfig') || 'null');
    if (c) { $('cfgKey').value = c.apiKey || ''; $('cfgUrl').value = c.baseUrl || 'https://api.openai.com/v1'; $('cfgModel').value = c.model || 'gpt-4o-mini'; }
  } catch (e) {}
}
function closeSettings() { $('modalBg').classList.remove('show'); }
function saveSettings() {
  const cfg = { apiKey: $('cfgKey').value.trim(), baseUrl: $('cfgUrl').value.trim(), model: $('cfgModel').value.trim() };
  try { localStorage.setItem('llmConfig', JSON.stringify(cfg)); } catch (e) {}
  $('chipLLM').style.display = cfg.apiKey ? 'flex' : 'none';
  closeSettings();
  renderKB();
}

/* ================= 11. 初始化 ================= */
$('input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('modalBg').addEventListener('click', e => { if (e.target === $('modalBg')) closeSettings(); });
applyI18n();
renderKB();
$('chipLLM').style.display = hasLLM() ? 'flex' : 'none';
renderEmpty();
</script>
